<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager with Session Storage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>

  <h1>Task Manager (Session Storage)</h1>

  <input type="text" id="taskInput" placeholder="Enter a task">
  <button id="addBtn">Add Task</button>
  <button id="clearBtn">Clear All</button>

  <ul id="taskList"></ul>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const clearBtn = document.getElementById('clearBtn');
    const taskList = document.getElementById('taskList');

    // Load tasks from sessionStorage or initialize empty array
    let tasks = sessionStorage.getItem('tasks') 
                ? sessionStorage.getItem('tasks').split('|') 
                : [];

    // Render tasks
    function renderTasks() {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.textContent = task;

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.style.marginLeft = '1rem';
        deleteBtn.onclick = () => deleteTask(index);

        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    // Save tasks
    function saveTasks() {
      sessionStorage.setItem('tasks', tasks.join('|'));
    }

    // Add task
    function addTask() {
      const task = taskInput.value.trim();
      if (!task) return alert('Enter a task!');
      tasks.push(task);
      saveTasks();
      taskInput.value = '';
      renderTasks();
    }

    // Delete task
    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    // Clear all
    function clearTasks() {
      tasks = [];
      saveTasks();
      renderTasks();
    }

    // Event listeners
    addBtn.addEventListener('click', addTask);
    clearBtn.addEventListener('click', clearTasks);

    // Render on page load
    renderTasks();
  </script>
</body>
</html>
